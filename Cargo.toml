[package]
name = "mangaocr"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native Rust manga OCR with cached ViT/BERT inference"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
# ONNX Runtime (loaded at run time) for the detector and recognizer graphs; see `onnx`.
onnx = ["dep:ort"]
directml = ["onnx", "ort/directml"]

[dependencies]
candle-core = "0.9.1"
candle-nn = "0.9.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
jpeg-decoder = { version = "0.3", default-features = false }
prost = "0.14"
# Spreads the CPU transpose convolution's col2im over channels; already in the tree via candle.
rayon = "1"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
sha2 = "0.10"
ureq = "3"

[[example]]
name = "onnx_page"
required-features = ["onnx"]
